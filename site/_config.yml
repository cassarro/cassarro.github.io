# Site settings
title: "Roderick Cassar"
tagline: "Product & Technology Leader at Entain"
logo: /assets/images/logo/logo-light.png
footer_logo: /assets/images/logo/logo-light.png
description: >-
  Roderick Cassar is a product and technology leader in iGaming, currently at Entain
  leading Global Casino Integrations. 20+ years across product, engineering and leadership
  at Entain, Betsson, Raketech, Tipico and KPMG.
keywords: >-
  Roderick Cassar, Entain, casino integrations, iGaming, product development,
  product management, software engineering, Betsson, Tipico, Raketech, KPMG,
  agile leadership, Malta
url: "https://www.roderickcassar.com"
lang: en
timezone: Europe/Malta
author:
  name: Roderick Cassar
  url: https://www.linkedin.com/in/rcassar
twitter:
  card: summary_large_image
social:
  name: Roderick Cassar
  links:
    - https://www.linkedin.com/in/rcassar
    - https://github.com/cassarro
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og/og-image.jpg

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap

google_analytics: G-23S9VSHWVC

# Site configuration for the Jekyll 2 Pagination Gem
pagination:
  enabled: false
  debug: false
  collection: "posts"
  per_page: 1
  permalink: "/pages/:num/"
  title: ":title - page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  category: "posts"
  tag: ""
  locale: ""
  trail:
    before: 2
    after:
  extension: "html"
  indexpage: "index"

autopages:
  enabled: false

tag_page_layout: category
tag_page_dir: tag
tag_permalink_style: pretty

jekyll-archives:
  enabled:
    - categories
  layout: category
  permalinks:
    category: "/category/:name/"

feed:
  collections:
    posts:
      path: "/index.xml"
