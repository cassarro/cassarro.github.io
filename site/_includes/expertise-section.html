<!--====== Competency Area Start ======-->
<section class="hobbie-area py-10" id="expertise">
    <div class="container">
        <div class="row">
            <div class="col-md-8 m-auto">
                <div class="section-title text-center mb-2">
                    <h2 class="mb-5">Competencies &amp; Skills</h2>
                    <p>The work I do sits between product, technology and delivery — especially where iGaming platforms have to integrate, scale and stay compliant.</p>
                </div>
            </div>
        </div>
        <div class="row">
            {% for skill in site.data.skills %}
                <div class="col-md-4 col-lg-3">
                    <div class="interests-box">
                        <div class="rounded-icon">
                            <img src="{{skill.icon}}" width="64" height="64" loading="lazy" alt="">
                        </div>
                        <h3 class="m-0">{{skill.name}}</h3>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
<!--====== Hobbie Area End ======-->
